name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser determinism test
        run: pnpm --filter @gamex/engine exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm depcruise
      - name: CLI smoke test
        run: node packages/cli/dist/gamex.js doctor --json
      - name: Spec Pack end to end (sample repo, temp dir)
        run: |
          repo="$(mktemp -d)"
          cp -r fixtures/swarm-rescue/sample-repo/. "$repo"
          mkdir -p "$repo/gamex"
          cp fixtures/swarm-rescue/swarm-rescue.game-model.json "$repo/gamex/game-model.json"
          git -C "$repo" init -q && git -C "$repo" add -A && git -C "$repo" -c user.email=ci@example.com -c user.name=ci commit -qm base
          node packages/cli/dist/gamex.js validate --cwd "$repo"
          node packages/cli/dist/gamex.js explore --cwd "$repo"
          node packages/cli/dist/gamex.js sync --cwd "$repo"
          git -C "$repo" add -A && git -C "$repo" -c user.email=ci@example.com -c user.name=ci commit -qm sync
          node packages/cli/dist/gamex.js sync --cwd "$repo"
          git -C "$repo" diff --exit-code
          test -z "$(git -C "$repo" status --porcelain)"
          (cd "$repo" && node gamex/tests/runner/run-golden.ts)

      - name: Extraction end to end (sample repo, recorded answers)
        run: |
          repo="$(mktemp -d)"
          cp -r fixtures/swarm-rescue/sample-repo/. "$repo"
          git -C "$repo" init -q && git -C "$repo" add -A && git -C "$repo" -c user.email=ci@example.com -c user.name=ci commit -qm base
          node packages/cli/dist/gamex.js init --cwd "$repo" --yes \
            --decisions fixtures/swarm-rescue/accept-all.json \
            --provider recorded --recordings fixtures/swarm-rescue/recordings
          node packages/cli/dist/gamex.js validate --cwd "$repo"
          test -z "$(git -C "$repo" status --porcelain --ignored -- gamex/.work | grep -v '^!!')"
          (cd "$repo" && node gamex/tests/runner/run-golden.ts)
